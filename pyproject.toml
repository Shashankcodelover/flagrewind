[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flagrewind"
version = "0.1.0"
description = "Human-approved on-call agent that identifies Flagsmith changes behind incidents, prepares the exact undo, and verifies recovery."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "Shashank J (Shashankcodelover)" },
]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.7,<16.0",
  "pydantic>=2.7,<3.0",
  "httpx>=0.27,<1.0",
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "openai>=1.50,<3.0",
  "flagsmith>=3.8,<5.0",
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "respx>=0.21,<1.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
flagrewind = "flagrewind.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
